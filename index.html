<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/hug.css">
    <title>HUG 주택도시보증공사</title>
  </head>
  <body>
      <header id="header">
        <div class="container">
          <div class="header_inner">
            <div id="logo">
              <a href="#"><img src="./img/logo.jpg" alt="로고"></a>
            </div>
            <nav id="nav">
              <ul>
                <li><a href="#">개인보증상품</a></li>
                <li><a href="#">기업보증상품</a></li>
                <li><a href="#">보증업무지원</a></li>
                <li><a href="#">보증현황/공시/공매정보</a></li>
                <li><a href="#">고객지원센터</a></li>
              </ul>
            </nav>
            <div class="menu_box">
              <span class="totalmenu">전체메뉴</span>
              <form class="search_box">
                <input type="text" placeholder="입력하시오">
                <button><spaen class="ir">버튼</spaen></button>
                <!-- reset.css에 숨김 텍스트 ir 해놨으니까 class로 ir 지정하기 -->
              </form>
            </div>
          </div>
        </div>
      </header>
      <!-- //header -->

      <main id="main">
        <div class="container">
          <h2 class="ir">여기서부터는 도시주택보증공사 메인 페이지입니다</h2>
          <div class="main_inner">
            <div class="left_content">
              <div class="left_box01">
                <p class="sub_title">안전한 내집 마련을 위한</p>
                <p class="title">개인보증</p>
                <div class="box_title">내게 맞는 보증상품 찾기</div>
                <div class="box_img">
                  <img src="./img/img_01.jpg" alt="개인보증 이미지">
                </div>
              </div>
              <div class="left_box02 brown">
                <!-- 띄어쓰기 하면 class명을 n개로 할 수 있음 -->
                <p class="title02">전세보증금반환보증</p>
                <p class="sub_title02">임차인의 전세보증금을 안전하게<br>책임지는 보증상품</p>
                <div class="dot_img">
                  <img src="./img/dot_01.jpg" alt="닷 이미지">
                </div>
                <div class="arrow_img">
                  <img src="./img/arrow_01.jpg" alt="애로우 이미지">
                </div>
                <div class="hug_img">
                  <img src="./img/img_03.jpg" alt="허그 이미지">
                </div>
              </div>
              <div class="left_box03 brown text_center">보증신청</div>
              <div class="left_box04 brown text_center">보증조회/변경</div>
            </div>

            <div class="center_content">
              <img src="./img/center_img.jpg" alt="메인 이미지">
            </div>

            <div class="right_content">
              <div class="right_box01">
                <p class="sub_title">성공적인주택사업을 위한</p>
                <p class="title">기업보증</p>
                <div class="box_title">내게 맞는 보증상품 찾기</div>
                <div class="box_img">
                  <img src="./img/img_02.jpg" alt="개인보증 이미지">
                </div>
              </div>
              <div class="right_box02">
                <p class="title02">주택분양보증</p>
                <p class="sub_title02">주택의 분양의 이행 또는 납부한 계약금 및<br>중도금의 환급을 책임지는 보증상품</p>
                <div class="dot_img">
                  <img src="./img/dot_02.jpg" alt="닷 이미지">
                </div>
                <div class="arrow_img">
                  <img src="./img/arrow_02.jpg" alt="애로우 이미지">
                </div>
                <div class="hug_img">
                  <img src="./img/img_04.jpg" alt="허그 이미지">
                </div>
              </div>
              <div class="right_box03 text_center">보증신청</div>
              <div class="right_box04 text_center">보증조회/변경</div>
            </div>
          </div>
        </div>
      </main>
      <!-- //main -->
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
  </body>
</html>
