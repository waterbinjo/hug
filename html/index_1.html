<!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/reset.css">
        <link rel="stylesheet" href="./css/style_1.css">
        <title>HUG 주택도로공사</title>
    </head>
    <body>
        <header id="header">
            <div id="container">
                <nav id="nav">
                    <div id="logo">
                        <a href=""><img src="./img/logo.jpg" alt="로고"></a>
                    </div>
                    <ul class="lnb">
                        <li><a href="#">개인보증상품</a></li>
                        <li><a href="#">기업보증상품</a></li>
                        <li><a href="#">보증업무지원</a></li>
                        <li><a href="#">보증현황/공시/공매정보</a></li>
                        <li><a href="#">고객지원센터</a></li>
                    </ul>
                </nav>
                <div class="gnb">
                    <a href="#">
                        <img src="./img/bar.jpg" alt="전체메뉴">
                        <span>전체메뉴</span>
                    </a>

                    <form class="search">
                        <input type="text">
                        <img src="./img/icon.jpg" alt="">
                    </form>
                </div>
            </div>
        </header>
        <!-- //header -->
        
        <main id="contents">
            <aside id="aside_left_top">
                <section id="section01">
                    <p>안전한 내집 마련을 위한</p>
                    <h2>개인 보증</h2>
                    <p>내게 맞는 보증상품 찾기</p>
                    <img src="./img/img_01.jpg" alt="">
                </section>
            </aside>
            <aside id="aside_left_bottum">
                <section id="section02">
                    <img src="./img/dot_01.jpg" alt="">
                    <h3>전세보증금반환보증금</h3>
                    <p>임차인의 전세보증금을 안전하게 책임지는 보증상품</p>
                    <img src="./img/arrow_01.jpg" alt="">
                    <img src="./img/img_03.jpg" alt="">
                </section>
                <section class="button">
                    <label for="first" class="first">보증신청</label>
                    <label for="second" class="second">보증조회/변경</label><br>
                </section>
            </aside>

            <section id="section03">
                <img src="./img/center_img.jpg" alt="">
            </section>

            <section id="section04">
                <p>성공적인 주택사업을 위한</p>
                <h2>기업보증</h2>
                <p>내게 맞는 보증상품 찾기</p>
                <img src="./img/img_02.jpg" alt="">
            </section>
            <section id="section05">
                <img src="./img/dot_02.jpg" alt="">
                <h3>주택분양보증</h3>
                <p>주택의 분양의 이행 또는 납부한 계약금 및 중도금의 환급을 책임지는 보증상품</p>
                <img src="./img/arrow_02.jpg" alt="">
                <img src="./img/img_04.jpg" alt="">
            </section>
            <section class="button">
                <label for="first" class="first">보증신청</label>
                <label for="second" class="second">보증조회/변경</label><br>
            </section>
        </main>
        <!-- //main -->
        
        <footer id="footer"></footer>
        <!-- //footer -->
    </body>
</html>
